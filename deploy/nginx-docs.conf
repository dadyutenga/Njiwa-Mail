# HTTPS reverse proxy for the public documentation site ONLY (docs.example.com).
# Upstream: the docs container compose.docs.yaml publishes on 127.0.0.1:8088.
#
# This server block must NOT be shared with the Njiwa-Mail API (deploy/nginx.conf). The docs
# host never proxies /admin/v1, /v1 or anything else: the container answers 404 for them, and
# there is no upstream to point them at here either.

server {
    listen 80;
    server_name docs.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name docs.example.com;

    ssl_certificate     /etc/letsencrypt/live/docs.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The container sets the security headers; do not hide or replace them here.
    }
}
