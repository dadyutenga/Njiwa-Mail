# Drop-in that lets the dashboard install the managed mail server through the
# host agent. Use it only on a host meant for "Send from my VPS", never on one
# that already runs a mail server:
#
#   install -D -m 0644 deploy/njiwa-mail-mta-agent.allow-install.conf \
#     /etc/systemd/system/njiwa-mail-mta-agent.service.d/allow-install.conf
#   systemctl daemon-reload && systemctl restart njiwa-mail-mta-agent
#
# Remove the file and restart to switch it off again. The installer installs
# packages and writes /etc, so the sandbox of the queue-only agent is lifted:
# anyone who is an installation operator in the dashboard can then have it make
# those changes, after approving the plan's digest.
[Service]
ExecStart=
ExecStart=/usr/local/bin/njiwa-mail mta-agent -socket /run/njiwa-mail/mta-agent.sock -token-file /etc/njiwa-mail/mta-agent.token -group 10001 -allow-install
ProtectSystem=false
ProtectHome=false
PrivateTmp=false
NoNewPrivileges=false
ProtectKernelModules=false
ProtectControlGroups=false
RestrictAddressFamilies=
