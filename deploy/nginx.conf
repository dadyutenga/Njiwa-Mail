# Reverse proxy for Ditronics Mail (HTTPS only). Replace the hostname and
# certificate paths. Place in /etc/nginx/conf.d/ on the host.
server {
    listen 80;
    server_name mail-api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mail-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/mail-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail-api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;            # app enforces 32 KiB; this is a coarse outer bound
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Only the public API surface is exposed. Health/readiness stay internal.
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_request_buffering on;
    }
    location = /health/live { proxy_pass http://127.0.0.1:8080; allow 127.0.0.1; deny all; }
    location / { return 404; }
}
