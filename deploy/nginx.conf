# Reverse proxy for Njiwa Mail (HTTPS only). Replace mail-api.example.com and
# the certificate paths, then place in /etc/nginx/conf.d/ on the host.
#
# Certificates: certbot certonly --webroot -w /var/www/certbot -d mail-api.example.com
# (the /.well-known/acme-challenge/ location below serves the challenge over
# plain HTTP; renewals keep working because everything else redirects).
#
# Upstreams are the loopback ports compose.yaml publishes:
#   127.0.0.1:8080  API (public /v1 and operator /admin/v1)
#   127.0.0.1:3000  dashboard (static frontend)
# Nothing else (PostgreSQL, inbound 2525, DKIM signer) is ever proxied.

server {
    listen 80;
    # listen [::]:80;          # uncomment when the host has IPv6
    server_name mail-api.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # "listen ... http2" works on the nginx of every supported distribution
    # (Debian 12: 1.22, Ubuntu 24.04: 1.24). On nginx >= 1.25.1 it only warns;
    # there you may use "http2 on;" instead.
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;   # uncomment when the host has IPv6
    server_name mail-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/mail-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail-api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:njiwa:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    client_max_body_size 8m;             # app caps a send, including attachments, at 6 MiB
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Public application API.
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_request_buffering on;
    }

    # Operator API used by the dashboard. Restrict it to office / VPN ranges
    # when you can. The app trusts X-Forwarded-For only when TRUST_PROXY=true,
    # and this proxy overwrites that header with the real client address.
    location /admin/v1/ {
        # allow 203.0.113.0/24;   # office or VPN
        # deny all;
        client_max_body_size 12m;            # template drafts, pasted messages for DKIM checks
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;              # connection tests and DNS checks can take a while
    }

    # /metrics and /health/* stay internal: scrape them on 127.0.0.1:8080.
    location /metrics { return 404; }
    location /health/ { return 404; }

    # Dashboard (single-page app; the frontend container serves index.html for
    # its own routes). Same restriction as /admin/v1/ applies if you use one.
    location / {
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
