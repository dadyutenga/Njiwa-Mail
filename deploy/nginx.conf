# Reverse proxy for Njiwa Mail (HTTPS only). Replace the hostname and
# certificate paths. Place in /etc/nginx/conf.d/ on the host.
server {
    listen 80;
    server_name mail-api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mail-api.example.com;

    ssl_certificate     /etc/letsencrypt/live/mail-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail-api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;             # app caps a send, including attachments, at 6 MiB
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Only the public API surface is exposed. Health/readiness stay internal.
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        proxy_request_buffering on;
    }
    # Admin API for the operator UI. Restrict it to the office / VPN ranges.
    # The app trusts X-Forwarded-For only when TRUST_PROXY=true is set, and
    # this proxy overwrites that header with the real client address.
    location /admin/v1/ {
        # allow 203.0.113.0/24;   # office or VPN
        # deny all;
        client_max_body_size 8m;             # template drafts and the same outer cap as /v1/
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    # /metrics and /health/* stay internal: scrape them on 127.0.0.1:8080.
    location = /health/live { proxy_pass http://127.0.0.1:8080; allow 127.0.0.1; deny all; }
    location / { return 404; }
}
