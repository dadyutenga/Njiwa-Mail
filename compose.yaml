# Njiwa Mail: standalone stack (own PostgreSQL, API, worker, scheduler, inbound).
# Independent of any client application and of any mail server's Compose project.
# Usage: cp .env.example .env && edit .env && docker compose up -d --build
#
# Both delivery modes use this file unchanged:
# - Existing SMTP: the worker connects out to your mail server.
# - Send from my VPS (managed): Postfix runs on the host (njiwa-mail installer).
#   The worker reaches its private submission listener at the network gateway
#   (172.30.0.1 by default: installer -submission 172.30.0.1:10587), and host
#   Postfix relays bounces to the inbound listener on 127.0.0.1:2525.
#
# The inbound listener (bounces, receiving) is the "inbound" profile:
#   docker compose --profile inbound up -d --build
# Mailcow users who want Mailcow to relay to it on Mailcow's Docker network add
# the override: -f compose.yaml -f compose.mailcow.yaml (see docs/MAILCOW_SETUP.md).
name: njiwa-mail

x-app: &app
  build: .
  image: njiwa-mail:local
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://mail:${POSTGRES_PASSWORD}@postgres:5432/mail?sslmode=disable
    LISTEN_ADDR: 0.0.0.0:8080
    DATA_DIR: /var/lib/njiwa-mail
  networks: [internal]
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    postgres: { condition: service_healthy }

services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    # Host ports are configurable so Njiwa-Mail never competes with an
    # application already on this server (njiwa-mail discover reports one).
    ports: ["127.0.0.1:${NJIWA_DASHBOARD_PORT:-3000}:80"]
    networks: [internal]
    depends_on:
      api: { condition: service_healthy }

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mail
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # Never published. A fixed address on Njiwa's own network lets host
    # commands (installer -record, the mta-log unit) reach it with a stable
    # DATABASE_URL: postgres://mail:<password>@${NJIWA_DB_IP}:5432/mail
    networks:
      internal:
        ipv4_address: ${NJIWA_DB_IP:-172.30.0.10}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail -d mail"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 512m } } }

  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]

  api:
    <<: *app
    command: ["serve"]
    ports: ["127.0.0.1:${NJIWA_API_PORT:-8080}:8080"]   # reverse proxy (HTTPS) terminates in front
    volumes: ["maildata:/var/lib/njiwa-mail"]   # serves inbound attachments
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy: { resources: { limits: { memory: 384m } } }   # argon2id logins use 64 MiB each

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "njiwa-mail", "worker-health", "-max", "60s"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy: { resources: { limits: { memory: 256m } } }

  scheduler:
    <<: *app
    command: ["scheduler"]
    volumes: ["maildata:/var/lib/njiwa-mail"]   # retention deletes attachments and spool files
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "njiwa-mail", "role-health", "-role", "scheduler", "-max", "60s"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy: { resources: { limits: { memory: 128m } } }

  # Private SMTP listener for bounces and received mail relayed by your mail
  # server. Published on the host's loopback only (for host Postfix in managed
  # mode); never on a public interface. Set INBOUND_ALLOWED_SOURCES to the
  # address the relay connects from (172.30.0.1 for host Postfix).
  inbound:
    <<: *app
    profiles: [inbound]
    command: ["inbound"]
    environment:
      <<: *app-env
      INBOUND_LISTEN_ADDR: 0.0.0.0:2525
    volumes: ["maildata:/var/lib/njiwa-mail"]
    ports: ["127.0.0.1:${NJIWA_INBOUND_PORT:-2525}:2525"]   # managed: installer -inbound 127.0.0.1:<port>
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "njiwa-mail", "role-health", "-role", "inbound", "-max", "60s"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy: { resources: { limits: { memory: 256m } } }

  # Local catcher for development. It is not Mailcow and it does not prove real delivery.
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: [dev]
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    networks: [internal]

networks:
  internal:
    # A fixed subnet gives the host a stable address on this network (the
    # gateway, .1), where a managed-mode Postfix listens for the worker.
    # Containers get addresses from ip_range only, so the fixed database
    # address (NJIWA_DB_IP, outside the range) is never taken by another one.
    ipam:
      config:
        - subnet: ${NJIWA_SUBNET:-172.30.0.0/24}
          ip_range: ${NJIWA_IP_RANGE:-172.30.0.128/25}

volumes:
  pgdata: {}
  maildata: {}
