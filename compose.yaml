# Ditronics Mail: standalone stack (own PostgreSQL, API, worker).
# Independent of any client application and of Mailcow's Compose project.
# Usage: cp .env.example .env && edit .env && docker compose up -d --build
name: ditronics-mail

x-app: &app
  build: .
  image: ditronics-mail:local
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgres://mail:${POSTGRES_PASSWORD}@postgres:5432/mail?sslmode=disable
    LISTEN_ADDR: 0.0.0.0:8080
  networks: [internal]
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mail
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [internal]          # never published to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail -d mail"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 512m } } }

  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]

  api:
    <<: *app
    command: ["serve"]
    ports: ["127.0.0.1:8080:8080"]   # reverse proxy (HTTPS) terminates in front
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy: { resources: { limits: { memory: 256m } } }

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "ditronics-mail", "worker-health", "-max", "60s"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy: { resources: { limits: { memory: 256m } } }

networks:
  internal: {}

volumes:
  pgdata: {}
