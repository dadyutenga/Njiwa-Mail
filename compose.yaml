# Njiwa Mail: standalone stack (own PostgreSQL, API, worker, scheduler, inbound).
# Independent of any client application and of Mailcow's Compose project.
# Usage: cp .env.example .env && edit .env && docker compose up -d --build
#
# The inbound SMTP listener is in the "inbound" profile because it joins
# Mailcow's Docker network, which must already exist:
#   docker compose --profile inbound up -d --build
# See docs/MAILCOW_SETUP.md before enabling it.
name: njiwa-mail

x-app: &app
  build: .
  image: njiwa-mail:local
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://mail:${POSTGRES_PASSWORD}@postgres:5432/mail?sslmode=disable
    LISTEN_ADDR: 0.0.0.0:8080
    DATA_DIR: /var/lib/njiwa-mail
  networks: [internal]
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    postgres: { condition: service_healthy }

services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["127.0.0.1:3000:80"]
    networks: [internal]
    depends_on:
      api: { condition: service_healthy }

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mail
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [internal]          # never published to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail -d mail"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 512m } } }

  migrate:
    <<: *app
    restart: "no"
    command: ["migrate"]

  api:
    <<: *app
    command: ["serve"]
    ports: ["127.0.0.1:8080:8080"]   # reverse proxy (HTTPS) terminates in front
    volumes: ["maildata:/var/lib/njiwa-mail"]   # serves inbound attachments
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy: { resources: { limits: { memory: 384m } } }   # argon2id logins use 64 MiB each

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "njiwa-mail", "worker-health", "-max", "60s"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy: { resources: { limits: { memory: 256m } } }

  scheduler:
    <<: *app
    command: ["scheduler"]
    volumes: ["maildata:/var/lib/njiwa-mail"]   # retention deletes attachments and spool files
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "njiwa-mail", "role-health", "-role", "scheduler", "-max", "60s"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy: { resources: { limits: { memory: 128m } } }

  # Private SMTP listener for mail relayed by Mailcow. NO published ports: it
  # is reachable only on Mailcow's Docker network, at a fixed address that the
  # Mailcow transport map points to.
  inbound:
    <<: *app
    profiles: [inbound]
    command: ["inbound"]
    environment:
      <<: *app-env
      INBOUND_LISTEN_ADDR: 0.0.0.0:2525
    volumes: ["maildata:/var/lib/njiwa-mail"]
    networks:
      internal: {}
      mailcow:
        ipv4_address: ${INBOUND_IPV4:-172.22.1.200}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "njiwa-mail", "role-health", "-role", "inbound", "-max", "60s"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy: { resources: { limits: { memory: 256m } } }

  # Local catcher for development. It is not Mailcow and it does not prove real delivery.
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: [dev]
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    networks: [internal]

networks:
  internal: {}
  mailcow:
    external: true
    name: ${MAILCOW_NETWORK:-mailcowdockerized_mailcow-network}

volumes:
  pgdata: {}
  maildata: {}
