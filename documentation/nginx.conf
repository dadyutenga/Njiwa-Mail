# The documentation site is static files. This server serves them and nothing else:
# no proxying, no upstreams, no access to the application API or the operator API.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  sendfile on;
  gzip on;
  gzip_types text/plain text/markdown text/css application/json application/yaml text/javascript image/svg+xml;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  types {
    text/markdown md;
    application/yaml yaml yml;
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    # Security headers. 'unsafe-inline' for scripts and styles is required by the Next.js static
    # export (hydration data is inline). That is acceptable only because content is linted: MDX
    # cannot contain script, expressions, imports or raw HTML (documentation/scripts/lib/lint.mjs).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Nothing here is the application. Answer 404 so a mistaken route never reaches an API.
    location ~ ^/(admin|v1|console|metrics|health)(/|$) { return 404; }
    location ~ /\. { return 404; }

    # The static search index has no extension.
    location = /api/search {
      default_type application/json;
      add_header Content-Security-Policy "default-src 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control "no-cache" always;
    }

    # Content-addressed build output never changes.
    location /_next/static/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # Pages and agent files are revalidated, so a deploy or a rollback shows up at once.
    location / {
      add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      try_files $uri $uri.html $uri/index.html =404;
    }
  }
}
