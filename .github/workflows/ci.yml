name: CI
on:
  push: { branches: [main, dev] }
  pull_request:

permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env: { POSTGRES_USER: mail, POSTGRES_PASSWORD: test, POSTGRES_DB: mail_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mail -d mail_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Throwaway database: the suite resets its public schema.
      TEST_DATABASE_URL: postgres://mail:test@localhost:5432/mail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -race -count=1 -timeout 280s

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (verifies the Dockerfile)
        run: docker build -t njiwa-mail:ci .
      - name: Binary runs and refuses to start without required config
        run: |
          if docker run --rm njiwa-mail:ci migrate; then echo "expected config error"; exit 1; fi
      - name: Compose files are valid, and core mode has no Mailcow network
        run: |
          printf 'POSTGRES_PASSWORD=x\nENCRYPTION_KEY=x\nHMAC_KEY=x\n' > .env
          docker compose config -q
          docker compose -f compose.yaml -f compose.mailcow.yaml --profile inbound config -q
          if docker compose --profile inbound config | grep -qi mailcow; then echo "core compose references Mailcow"; exit 1; fi

  # Known-vulnerability scan of the Go dependencies and standard library.
  # Blocking: the first run found real advisories (Go 1.26.0 stdlib, brotli,
  # Fiber); they were fixed and it has been clean since.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Managed mode against real Postfix and OpenDKIM: installer plan/apply, then
  # no open relay, mutual-TLS-only submission, sender restrictions and DKIM
  # signing end to end. Blocking: it has run green on hosted runners.
  managed-mta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Install Postfix and OpenDKIM (no Postfix configuration)
        run: |
          echo "postfix postfix/main_mailer_type select No configuration" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y postfix opendkim
      - name: Installer plan and apply
        run: |
          go build -o njiwa-mail .
          F="-hostname mailout.example.test -domains notify.example.test -bounce-domain bounce.example.test -selector njiwa"
          ./njiwa-mail installer plan $F
          D=$(./njiwa-mail installer plan $F -json | python3 -c 'import json,sys;print(json.load(sys.stdin)["digest"])')
          sudo ./njiwa-mail installer apply $F -approve "$D"
      - name: End-to-end checks
        run: sudo env "PATH=$PATH" go test -tags managed_e2e ./internal/installer/managed -run E2E -count=1 -v

  # The shipped stack starts from nothing: build the images, bring Compose up,
  # wait for readiness, sign in, take it down. Catches a broken Dockerfile,
  # migration, healthcheck or Compose file that unit tests cannot see.
  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          {
            echo "POSTGRES_PASSWORD=ci-postgres-password"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "HMAC_KEY=$(openssl rand -base64 48)"
          } > .env
          docker compose up -d --build
          ok=""
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/health/ready && ok=1 && break; sleep 2; done
          [ -n "$ok" ] || { docker compose logs; exit 1; }
      - name: Sign in, protected routes, operator commands
        run: |
          printf 'ci-password-12345\n' | docker compose exec -T api njiwa-mail user create -email ci@example.com
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/admin/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"ci-password-12345"}')
          [ "$code" = 200 ] || { echo "login answered $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin/v1/installation)
          [ "$code" = 401 ] || { echo "an unauthenticated admin route answered $code"; exit 1; }
          docker compose exec -T api njiwa-mail rekey -check
          docker compose exec -T api njiwa-mail retention
      - name: Read-only discovery from the image, recorded for the setup wizard
        run: |
          sh scripts/discover.sh | tee /tmp/discover.txt
          grep -q "Recommended delivery mode" /tmp/discover.txt
          sh scripts/discover.sh -record
          rec=$(docker compose exec -T postgres psql -U mail -d mail -tAc "SELECT discovered_at IS NOT NULL FROM installation_settings")
          [ "$rec" = t ] || { echo "discovery was not recorded"; exit 1; }
      - name: Backup, delete everything, restore into a fresh stack (task T3.5)
        run: |
          export DATABASE_URL="postgres://mail:ci-postgres-password@postgres:5432/mail?sslmode=disable" PG_CLIENT=docker DATA_VOLUME=njiwa-mail_maildata
          sh scripts/backup.sh /tmp/njiwa-backup
          docker compose down -v
          docker compose up -d postgres
          for i in $(seq 1 30); do docker compose exec -T postgres pg_isready -U mail -d mail && break; sleep 2; done
          sh scripts/restore.sh /tmp/njiwa-backup
          docker volume inspect njiwa-mail_maildata >/dev/null
          docker compose up -d
          ok=""
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/health/ready && ok=1 && break; sleep 2; done
          [ -n "$ok" ] || { docker compose logs; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/admin/v1/auth/login -H 'Content-Type: application/json' -d '{"email":"ci@example.com","password":"ci-password-12345"}')
          [ "$code" = 200 ] || { echo "the restored user cannot sign in: $code"; exit 1; }
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v

  # Browser end-to-end tests (Playwright, Chromium) against the Compose stack:
  # sign-in, the delivery-mode wizard, adding a domain.
  e2e:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Start the stack
        run: |
          {
            echo "POSTGRES_PASSWORD=ci-postgres-password"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "HMAC_KEY=$(openssl rand -base64 48)"
            echo "ADMIN_INSECURE_COOKIES=true"   # the tests use plain HTTP
          } > .env
          docker compose up -d --build
          ok=""
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8080/health/ready && ok=1 && break; sleep 2; done
          [ -n "$ok" ] || { docker compose logs; exit 1; }
          printf 'ci-password-12345\n' | docker compose exec -T api njiwa-mail user create -email ci@example.com
          curl -fsS -o /dev/null http://127.0.0.1:3000/login
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env: { CI: "1", E2E_BASE_URL: "http://127.0.0.1:3000" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: "frontend/playwright-report\nfrontend/test-results", retention-days: 7 }
      - if: always()
        run: docker compose down -v

  # The public documentation portal. Pull requests may carry untrusted MDX: this job only builds and
  # lints it with a read-only token and no secrets, and nothing is deployed from here.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm ci --ignore-scripts
        working-directory: documentation
      - run: node node_modules/fumadocs-mdx/bin.js
        working-directory: documentation
      - run: npm run typecheck
        working-directory: documentation
      - run: npm run lint
        working-directory: documentation
      - run: npm test
        working-directory: documentation
      - run: npm run build
        working-directory: documentation
        env: { NEXT_PUBLIC_DOCS_COMMIT: "${{ github.sha }}" }
      - run: npm run check:snippets
        working-directory: documentation
      - run: npm run check:export
        working-directory: documentation
        env: { NEXT_PUBLIC_DOCS_COMMIT: "${{ github.sha }}" }
      - run: npx playwright install --with-deps chromium
        working-directory: documentation
      - run: npx playwright test
        working-directory: documentation
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: docs-playwright, path: "documentation/test-results", retention-days: 7 }

  # The docs container must start, serve every agent file with the right type, answer 404 for any
  # API path, and carry the commit it was built from.
  docs-image:
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f documentation/Dockerfile --build-arg DOCS_COMMIT=${{ github.sha }} -t njiwa-mail-docs:ci .
        env: { DOCKER_BUILDKIT: "1" }
      - run: |
          docker run -d --name docs --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:8088:8080 njiwa-mail-docs:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8088/docs && break; sleep 1; done
          sh documentation/scripts/smoke.sh http://127.0.0.1:8088 "${{ github.sha }}"
      - if: always()
        run: docker rm -f docs || true

  # Two builds of the same source from different directories must be identical,
  # and the dependency inventory (SBOM) is kept with every run.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Reproducible build
        run: |
          mkdir -p /tmp/one /tmp/two && cp -r . /tmp/one && cp -r . /tmp/two
          (cd /tmp/one && CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o /tmp/a ./cmd/njiwa-mail)
          (cd /tmp/two && CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o /tmp/b ./cmd/njiwa-mail)
          sha256sum /tmp/a /tmp/b
          cmp /tmp/a /tmp/b
      - name: Software bill of materials
        run: |
          mkdir sbom
          go list -m -json all > sbom/go-modules.json
          go version -m /tmp/a > sbom/binary-build-info.txt
          (cd frontend && npm ci --ignore-scripts --no-audit --no-fund && npm ls --all --json > ../sbom/npm-packages.json || true)
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom, retention-days: 90 }
