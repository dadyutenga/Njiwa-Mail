openapi: 3.0.3
info:
  title: Njiwa Mail API
  version: 1.0.0
  description: |
    Implemented contract only. `submitted` means the SMTP server (Mailcow)
    positively acknowledged the message. It does NOT mean delivered, inboxed or read.
servers:
  - url: https://mail-api.example.com
security:
  - bearer: []
paths:
  /v1/emails:
    post:
      summary: Queue one transactional email
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
          description: One per logical application event. Reuse it on every retry of that event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendRequest' }
      responses:
        '202': { description: Durably queued, or identical replay (original id), content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: missing_scope | sender_not_approved | project_disabled, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: idempotency_conflict (same key, different payload), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: body_too_large (32 KiB max), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'Validation: invalid_request, invalid_recipient, invalid_sender, unknown_template, template_version_required, unknown_variable, missing_variable, invalid_variable_type, invalid_variable_format, variable_too_long, variable_out_of_range, invalid_characters, invalid_url, url_origin_not_approved, invalid_ttl, invalid_metadata, idempotency_key_invalid, recipient_suppressed, recipient_not_allowed', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: rate_limited; see Retry-After, headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: Durable persistence unavailable. Nothing was accepted; retry with the same key., headers: { Retry-After: { schema: { type: integer } } } }
  /v1/emails/{id}:
    get:
      summary: Metadata-only status (never variables, tokens or recipient)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/Status' } } } }
        '404': { description: Unknown or foreign message id }
  /health/live: { get: { security: [], summary: Process liveness, responses: { '200': { description: ok } } } }
  /health/ready: { get: { security: [], summary: Database reachable and schema present, responses: { '200': { description: ready }, '503': { description: unavailable } } } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: 'dmk_<sbx|liv>_<prefix>_<secret>; scopes emails:send, emails:read' }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      properties: { error: { type: object, properties: { code: { type: string } } } }
    SendRequest:
      type: object
      additionalProperties: false
      required: [from, to, template, template_version, variables]
      properties:
        from: { type: string, description: Must be an approved sender identity for the key's project/environment }
        to: { type: string, description: Exactly one recipient (bare ASCII address) }
        template: { type: string, enum: [otp, password-reset, account-notice] }
        template_version: { type: integer, enum: [1] }
        variables:
          type: object
          description: |
            otp.v1: name?, code (4-12 alnum), expires_in_minutes (1-60).
            password-reset.v1: name?, reset_url (https, origin approved for the environment), expires_in_minutes (1-1440).
            account-notice.v1: name?, title (<=100, single line), message (<=1000). No HTML.
        ttl_seconds: { type: integer, description: 'auth templates default 300, max 900; notice default 3600, max 86400; min 30' }
        metadata: { type: object, additionalProperties: false, properties: { request_id: { type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$' } } }
    Accepted:
      type: object
      properties: { id: { type: string, format: uuid }, status: { type: string } }
    Status:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, submitting, submitted, retry_wait, failed, unknown, expired, captured] }
        template: { type: string }
        template_version: { type: integer }
        attempts: { type: integer }
        smtp_reply: { type: string, description: Server acknowledgement text (queue id) once submitted }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        submitted_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        metadata: { type: object }
        events: { type: array, items: { type: object, properties: { type: { type: string }, reason: { type: string }, at: { type: string, format: date-time } } } }
