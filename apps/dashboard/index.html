<!doctype html>
<html lang="en" class="od od-app">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Njiwa-Mail is an open-source email platform for your apps. Send, receive and track email through one API, on servers you control."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Njiwa-Mail — Your own mail carrier." />
    <meta
      property="og:description"
      content="Send, receive and track transactional email through one API, on servers you control."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414" />
    <link rel="icon" type="image/svg+xml" href="/njiwa-dove.svg" />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link href="https://fonts.bunny.net/css?family=inter:400,500,600,700" rel="stylesheet" />
    <script>
      try {
        const theme = localStorage.getItem("theme");
        const dark =
          theme === "dark" || (!theme && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.mode = dark ? "dark" : "light";
      } catch {}
    </script>
    <title>Njiwa-Mail — Your own mail carrier.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
